r="start" font-weight="400">This is one analytical option, not a claim that Synapse is always preferable to Fabric or Databricks.</text><text x="70" y="894" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">Identity, lineage, quality and retention apply at each boundary. The document store icon is not a warehouse.</text><text x="70" y="970" font-family="DejaVu Sans" font-size="17" fill="#5a7484" text-anchor="start" font-weight="400">Original teaching architecture • Microsoft Azure service icons, unmodified • not a deployed system</text></svg>