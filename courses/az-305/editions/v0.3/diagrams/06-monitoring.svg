font-family="DejaVu Sans" font-size="19" fill="#245b78" text-anchor="middle" font-weight="400">Workspace-based data</text><path d="M870,595 C1015.0,595 1015.0,510 1160,510" stroke="#327fa5" fill="none" stroke-width="3" marker-end="url(#arrow)" /><text x="1015.0" y="538.5" font-family="DejaVu Sans" font-size="19" fill="#245b78" text-anchor="middle" font-weight="400">Collect / transform / route</text><path d="M1320,480 C1415.0,480 1415.0,480 1510,480" stroke="#327fa5" fill="none" stroke-width="3" marker-end="url(#arrow)" /><text x="1415.0" y="466.0" font-family="DejaVu Sans" font-size="19" fill="#245b78" text-anchor="middle" font-weight="400">Alert signal</text><text x="70" y="865" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">Resource diagnostic settings route supported platform logs separately. DCRs do not replace every diagnostic setting.</text><text x="70" y="894" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">Redaction, collection health and access matter. A dashboard with no errors but no traffic is not proof of service health.</text><text x="70" y="970" font-family="DejaVu Sans" font-size="17" fill="#5a7484" text-anchor="start" font-weight="400">Original teaching architecture • Microsoft Azure service icons, unmodified • not a deployed system</text></svg>