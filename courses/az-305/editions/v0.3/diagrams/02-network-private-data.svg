ont-family="DejaVu Sans" font-size="19" fill="#245b78" text-anchor="middle" font-weight="400">SQL connection</text><path d="M1360,620 C1450.0,620 1450.0,620 1540,620" stroke="#327fa5" fill="none" stroke-width="3" marker-end="url(#arrow)" /><text x="1450.0" y="606.0" font-family="DejaVu Sans" font-size="19" fill="#245b78" text-anchor="middle" font-weight="400">Private access</text><path d="M950,650 C1075.0,650 1075.0,650 1200,650" stroke="#327fa5" fill="none" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 7"/><text x="1075.0" y="636.0" font-family="DejaVu Sans" font-size="19" fill="#245b78" text-anchor="middle" font-weight="400">Name resolution</text><text x="70" y="865" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">Public database access must be separately configured; a private endpoint alone does not disable it.</text><text x="70" y="894" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">NSGs, outbound connectivity, identity and certificates are separate controls. DNS determines the resolved destination.</text><text x="70" y="970" font-family="DejaVu Sans" font-size="17" fill="#5a7484" text-anchor="start" font-weight="400">Original teaching architecture • Microsoft Azure service icons, unmodified • not a deployed system</text></svg>