 data path</text><text x="70" y="865" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">Failover groups / client reconnect behavior and routing must be designed. Replication can propagate a bad update.</text><text x="70" y="894" font-family="DejaVu Sans" font-size="21" fill="#284e66" text-anchor="start" font-weight="400">RTO includes detection, decision and validation; RPO depends on the recovery point. No recovery timing is proven here.</text><text x="70" y="970" font-family="DejaVu Sans" font-size="17" fill="#5a7484" text-anchor="start" font-weight="400">Original teaching architecture • Microsoft Azure service icons, unmodified • not a deployed system</text></svg>